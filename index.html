<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Basic AR Example</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <!-- AR Scene -->
    <a-scene embedded vr-mode-ui="enabled: false" renderer="logarithmicDepthBuffer: true"
        arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false;">

        <a-assets>
           <a-asset-item id="custom-model" src="./image/IronMan/im.gltf"></a-asset-item>
        </a-assets>
       
        <!-- Define the marker pattern -->
        <a-marker preset="hiro">
            <a-box 
                position="0 0 0" 
                scale="0.5 0.5 0.5"
                material="color: #4CC3D9;"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 3000">
            </a-box>
        </a-marker>

        <!-- add custom model -->
        <a-marker type="pattern" url="image/pattern-desk.patt">
            <a-entity 
                gltf-model="#custom-model" 
                scale="0.05 0.05 0.05" 
                position="0 0 0" 
                rotation="0 180 0">
            </a-entity>
        </a-marker>

        <!-- Add camera -->
        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
